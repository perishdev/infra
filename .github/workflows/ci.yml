name: CI

# Fork-safe lint and validate gates. No secrets, no state access.
# Real plans / applies run in HCP Terraform via its own VCS integration
# (see docs/ci.md) — they are intentionally not triggered from this workflow.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Terraform comes from mise.toml + mise.lock, the single pin source for
  # local machines and CI. Locked mode fails instead of resolving off-lock.
  MISE_LOCKED: "1"

jobs:
  fmt:
    name: terraform fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          install_args: terraform
      - run: terraform fmt -check -recursive terraform/

  validate:
    name: terraform validate (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          - terraform/cloudflare
          - terraform/github
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          install_args: terraform
      - name: terraform init (no backend)
        working-directory: ${{ matrix.dir }}
        run: terraform init -backend=false -input=false
      - name: terraform validate
        working-directory: ${{ matrix.dir }}
        run: terraform validate
