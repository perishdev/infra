# Toolchain for this repo — pinned so local machines and CI resolve identical versions.
#
#   mise install    install everything below (reads mise.lock)
#
# Nothing installs system-wide: tools live under ~/.local/share/mise/installs
# and resolve via mise's shims/exec inside this directory.

[tools]
terraform = "1.15.9"  # repo requires >= 1.9 (see terraform/*/versions.tf)
gh = "2.101.0"
jq = "1.7.1"

[settings]
# Write mise.lock with resolved versions + checksums so CI matches local.
lockfile = true
